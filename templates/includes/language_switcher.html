{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
{% get_available_languages as LANGUAGES %}
{% get_language_info_list for LANGUAGES as languages %}
<div class="lang-switcher" data-lang-switcher>
  <button type="button"
          class="lang-switcher-toggle"
          id="{{ select_id|default:'langSelect' }}Btn"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-label="{% trans 'Select language' %}">
    <i class="bi bi-globe2" aria-hidden="true"></i>
    <span class="lang-switcher-current">
      {% for lang in languages %}
        {% if lang.code == LANGUAGE_CODE %}{{ lang.name_local }}{% endif %}
      {% endfor %}
    </span>
    <i class="bi bi-chevron-down lang-switcher-caret" aria-hidden="true"></i>
  </button>

  <div class="lang-switcher-menu" role="listbox" hidden>
    {% for lang in languages %}
    <form action="{% url 'set_language' %}" method="post" class="lang-switcher-option-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <input type="hidden" name="language" value="{{ lang.code }}">
      <button type="submit"
              class="lang-switcher-option{% if lang.code == LANGUAGE_CODE %} is-active{% endif %}"
              role="option"
              aria-selected="{% if lang.code == LANGUAGE_CODE %}true{% else %}false{% endif %}">
        <span class="lang-option-native">{{ lang.name_local }}</span>
        <span class="lang-option-code">{{ lang.code|upper }}</span>
      </button>
    </form>
    {% endfor %}
  </div>
</div>
