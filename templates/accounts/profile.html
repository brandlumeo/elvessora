{% extends 'base.html' %}
{% load static crispy_forms_tags %}

{% block title %}My Account — {{ site_settings.brand_name }}{% endblock %}
{% block extra_css %}<link href="{% static 'css/auth-shop.css' %}" rel="stylesheet">{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-3">
            <div class="account-sidebar nav flex-column">
                <a class="nav-link active" href="{% url 'accounts:profile' %}">Profile</a>
                <a class="nav-link" href="{% url 'accounts:order_history' %}">Orders</a>
                <a class="nav-link" href="{% url 'accounts:wishlist' %}">Wishlist</a>
                <a class="nav-link" href="{% url 'accounts:addresses' %}">Addresses</a>
            </div>
        </div>
        <div class="col-md-9 checkout-form-lux">{% crispy form %}</div>
    </div>
</div>
{% endblock %}
