{% extends 'base.html' %}
{% load static %}

{% block title %}{{ page.title }} — {{ site_settings.brand_name }}{% endblock %}
{% block content %}
<div class="page-header page-header--video page-header--center">
    <video class="page-header__video" autoplay muted loop playsinline preload="auto"
           poster="{% static 'video/elvessora-legal-poster.webp' %}" aria-hidden="true">
        <source src="{% static 'video/elvessora-legal.mp4' %}" type="video/mp4">
    </video>
    <div class="page-header__shade" aria-hidden="true"></div>
    <div class="container"><h1>{{ page.title }}</h1><p class="text-muted small">Last updated: {{ page.updated_at|date:"F d, Y" }}</p></div>
</div>
<div class="container pb-5"><div class="col-lg-8 mx-auto">{{ page.content|linebreaks }}</div></div>
{% endblock %}
